plugins {
    id 'maven-publish'
    alias libs.plugins.replacetoken
}

final int mcVersion = project.mcVersion
final boolean unobfuscated = mcVersion >= 26_00_00


apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'
apply plugin: "io.freefair.lombok"

repositories {
    mavenLocal()

    maven {
        name = "Masa Maven"
        url = "https://masa.dy.fi/maven/"
    }

    mavenCentral()
}

loom {
    enableTransitiveAccessWideners.set(false)

    interfaceInjection {
        enableDependencyInterfaceInjection.set(false)
        isEnabled.set(false)
    }

    def path = "src/main/resources/${project.parent.property("mod.id")}.classTweaker"

    def accessWidenerFile = file(path)
    if (!accessWidenerFile.exists()) {
        accessWidenerFile = rootProject.file(path)
    }

    accessWidenerPath = accessWidenerFile

    var isJbr = System.getProperty('java.vm.vendor').contains('JetBrains')
    runConfigs.configureEach {
        // Dump modified classes automatically.
        property("mixin.debug.export", "true")
        if (isJbr) vmArgs("-XX:+AllowEnhancedClassRedefinition")
    }

    runConfigs.named("client") {
        programArgs([
                "--username",
                project.getOrDefault("ow.game.window.username", "dev")
        ])
        runDir("run/client")
    }

    runConfigs.named("server") {
        runDir("run/server")
    }
}

dependencies {
    def processDependency = { dep ->
        // https://github.com/FabricMC/fabric-loader/issues/783
        if (dep instanceof ModuleDependency) {
            if (!(dep.group == 'net.fabricmc' && dep.name == 'fabric-loader')) {
                dep.exclude group: 'net.fabricmc', module: 'fabric-loader'
            }
            dep.exclude group: 'com.github.astei', module: 'lazydfu'
            dep.exclude group: 'com.github.2No2Name', module: 'McTester'
        }
        return dep
    }
    def autoImplementation = { Object... args -> processDependency(unobfuscated ? implementation(*args) : modImplementation(*args)) }

    minecraft "com.mojang:minecraft:${project.property("dependencies.minecraft_version")}"
    if (!unobfuscated) mappings loom.officialMojangMappings()

    implementation "com.google.code.findbugs:jsr305:3.0.2"
    autoImplementation libs.fabric.loader
    autoImplementation "net.fabricmc.fabric-api:fabric-api:${project.property("dependencies.fabric_api_version")}"
    autoImplementation "carpet:fabric-carpet:${project.property("dependencies.carpet_version")}"
}

apply from: "$rootDir/common.gradle"
